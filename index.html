        .controls { margin-top: 15px; }

        #prediction { font-size: 72px; font-weight: bold; color: #00adb5; margin-top: 15px; text-shadow: 0 0 10px rgba(0, 173, 181, 0.5); }
        .status { color: #888; font-size: 14px; margin-top: 10px; font-style: italic; }
    </style>
</head>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    // Parameter holders for your custom scratch model
    let w1 = [], b1 = [], w2 = [], b2 = [];

    function clearCanvas() {
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, 28, 28);
        document.getElementById('prediction').innerText = '--';
    }
    clearCanvas();

    // Mouse Event Listeners for drawing
    canvas.addEventListener('mousedown', (e) => { isDrawing = true; draw(e); });
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mouseout', () => isDrawing = false);

    function draw(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        
        // Exact 0-27 coordinate mapping
        const x = Math.floor((e.clientX - rect.left) / (rect.width / 28));
        const y = Math.floor((e.clientY - rect.top) / (rect.height / 28));
        
        // Draw the core bright white pixel
        ctx.fillStyle = 'white';
        ctx.fillRect(x, y, 1, 1);
        
        // Thinner brush: Softer adjacent pixels, no corners
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(x+1, y, 1, 1); 
        ctx.fillRect(x-1, y, 1, 1);
        ctx.fillRect(x, y+1, 1, 1); 
        ctx.fillRect(x, y-1, 1, 1);
    }

    // --- BULLETPROOF TEXT LOADER ---
    async function loadTextFile(url) {
        const response = await fetch(url);
        const text = await response.text();
        
        // Split into rows, and safely filter out any empty trailing lines
        const lines = text.trim().split('\n').filter(line => line.trim() !== "");
        
        return lines.map(row => row.split(',').map(Number));
    }

    async function initModel() {
        try {
            document.getElementById('status-text').innerText = "Downloading text weights... please wait a few seconds.";
            
            // Load your 4 specific text files
            w1 = await loadTextFile('w1.txt');
            b1 = await loadTextFile('b1.txt');
            w2 = await loadTextFile('w2.txt');
            b2 = await loadTextFile('b2.txt');
            
            document.getElementById('status-text').innerText = "Scratch text model loaded! Ready to test.";
            document.getElementById('status-text').style.color = "#00adb5";
        } catch (err) {
            document.getElementById('status-text').innerText = "Error loading .txt files. Check exact filenames.";
            document.getElementById('status-text').style.color = "#ff2e63";
            console.error(err);
        }
    }
    initModel();

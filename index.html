<!DOCTYPE html>
<html>
<head>
  <title>MNIST Digit Predictor</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #f5f5f5;
    }

    canvas {
      border: 3px solid black;
      background: white;
      cursor: crosshair;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }

    #result {
      font-size: 22px;
      margin-top: 15px;
    }

    #status {
      color: red;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h2>Draw a digit (0–9)</h2>

<canvas id="canvas" width="280" height="280"></canvas>
<br>

<button id="predictBtn" disabled onclick="predict()">Predict</button>
<button onclick="clearCanvas()">Clear</button>

<h3 id="result">Loading model...</h3>
<p id="status"></p>

<script src="script.js"></script>

</body>
</html>

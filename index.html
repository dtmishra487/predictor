<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scratch NumPy 28x28 Model Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        h1 { color: #00adb5; margin-bottom: 5px; }
        .container { text-align: center; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Visually scale up the tiny 28x28 matrix canvas crisp and sharp */
        canvas { 
            background: #000000; 
            border: 4px solid #333; 
            border-radius: 4px; 
            cursor: crosshair;
            width: 280px;  
            height: 280px; 
            image-rendering: pixelated; 
        }
        
        .controls { margin-top: 15px; }
        button { background: #00adb5; border: none; color: white; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #007c82; }
        #prediction { font-size: 64px; font-weight: bold; color: #00adb5; margin-top: 15px; }
        .status { color: #888; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Custom Engine Digit Recognizer</h1>
    <p>Draw inside the exact 28x28 grid below</p>
    
    <canvas id="canvas" width="28" height="28"></canvas>

    <div class="controls">
        <button onclick="clearCanvas()">Clear Grid</button>
        <button onclick="predictDigit()">Predict</button>
    </div>

    <div id="prediction">--</div>
    <div id="status-text" class="status">Loading custom scratch weights...</div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    // 2-Layer parameter holders matching your variable dictionary structures
    let w1 = [], b1 = [], w2 = [], b2 = [];

    function clearCanvas() {
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, 28, 28);
        document.getElementById('prediction').innerText = '--';
    }
    clearCanvas();

    // Direct pixel coordinate mapping event trackers
    canvas.addEventListener('mousedown', (e) => { isDrawing = true; draw(e); });
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mouseout', () => isDrawing = false);

    function draw(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        
        const x = Math.floor((e.clientX - rect.left) / (rect.width / 28));
        const y = Math.floor((e.clientY - rect.top) / (rect.height / 28));
        
        // Force draw a raw white input pixel
        ctx.fillStyle = 'white';
        ctx.fillRect(x, y, 1, 1);
        
        // Soft anti-aliasing values to emulate real writing flow pressure maps
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(x+1, y, 1, 1); ctx.fillRect(x-1, y, 1, 1);
        ctx.fillRect(x, y+1, 1, 1); ctx.fillRect(x, y-1, 1, 1);
    }

    async function loadTextFile(url) {
        const response = await fetch(url);
        const text = await response.text();
        return text.trim().split('\n').map(row => row.split(',').map(Number));
    }

    async function initModel() {
        try {
            // Fetching your 2-layer parameters directly from the root repository path
            w1 = await loadTextFile('w1.txt'); b1 = await loadTextFile('b1.txt');
            w2 = await loadTextFile('w2.txt'); b2 = await loadTextFile('b2.txt');
            document.getElementById('status-text').innerText = "Scratch model loaded successfully! Ready to test.";
            document.getElementById('status-text').style.color = "#00adb5";
        } catch (err) {
            document.getElementById('status-text').innerText = "Error loading weight files. Ensure filenames are exact.";
            document.getElementById('status-text').style.color = "#ff2e63";
        }
    }
    initModel();

    // Your Exact Forward Pass Mathematical Subroutines
    function relu(x) { return Math.max(0, x); }
    function softmax(arr) {
        const max = Math.max(...arr);
        const exps = arr.map(x => Math.exp(x - max));
        const sum = exps.reduce((a, b) => a + b, 0);
        return exps.map(x => x / sum);
    }

    function predictDigit() {
    if (w1.length === 0) return alert("Model matrices not loaded!");

    const imgData = ctx.getImageData(0, 0, 28, 28);
    let X = [];
    for (let i = 0; i < imgData.data.length; i += 4) {
        X.push(imgData.data[i] / 255.0); 
    }

    // --- FORWARD PASS LAYER 1 (Column-Vector Style matching your scratch weights) ---
    let Z1 = [];
    // w1.length is the number of hidden neurons (e.g., 128)
    for (let i = 0; i < w1.length; i++) {
        let sum = 0;
        for (let j = 0; j < 784; j++) {
            // Read your weight matrix vertically to match your NumPy shape!
            sum += w1[i][j] * X[j]; 
        }
        Z1.push(sum + b1[i][0]);
    }
    let A1 = Z1.map(relu);

    // --- FORWARD PASS LAYER 2 ---
    let Z2 = [];
    for (let i = 0; i < w2.length; i++) {
        let sum = 0;
        for (let j = 0; j < A1.length; j++) {
            sum += w2[i][j] * A1[j];
        }
        Z2.push(sum + b2[i][0]);
    }
    let A2 = softmax(Z2);

    // --- ARGMAX ---
    let maxIdx = 0, maxVal = A2[0];
    for (let i = 1; i < A2.length; i++) {
        if (A2[i] > maxVal) { maxVal = A2[i]; maxIdx = i; }
    }

    document.getElementById('prediction').innerText = maxIdx;
}

        // --- FORWARD PASS LAYER 1: Z1 = W1 * X + B1 ---
        let Z1 = [];
        for (let i = 0; i < w1.length; i++) {
            let sum = 0;
            for (let j = 0; j < w1[i].length; j++) {
                sum += w1[i][j] * X[j];
            }
            Z1.push(sum + b1[i][0]);
        }
        let A1 = Z1.map(relu);

        // --- FORWARD PASS LAYER 2: Z2 = W2 * A1 + B2 ---
        let Z2 = [];
        for (let i = 0; i < w2.length; i++) {
            let sum = 0;
            for (let j = 0; j < w2[i].length; j++) {
                sum += w2[i][j] * A1[j];
            }
            Z2.push(sum + b2[i][0]);
        }
        let A2 = softmax(Z2);

        // --- ARGMAX TARGET IDENTIFICATION ---
        let maxIdx = 0, maxVal = A2[0];
        for (let i = 1; i < A2.length; i++) {
            if (A2[i] > maxVal) {
                maxVal = A2[i];
                maxIdx = i;
            }
        }

        document.getElementById('prediction').innerText = maxIdx;
    }
</script>
</body>
</html>
